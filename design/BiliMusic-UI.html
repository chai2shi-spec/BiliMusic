<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>BiliMusic 界面/组件/原型方案 · 依据最新代码 · B站粉色基调</title>
<style>
  :root{
    /* ══ 品牌色：哔哩哔哩粉 ══════════════════════════
       brand      视觉主色 —— 图标 / 实底填充 / 大字号 / 底栏光晕
       brand-deep 品牌深粉 —— 白底上的粉字（2.20:1 → 5.81:1，AA 达标）
       brand-blue B 站蓝 —— 链接与次要强调
       brand-tint 浅粉 —— 区块底 / 搜索框 / 模式药丸                      */
    --brand:#FB7299;
    --brand-deep:#C2185B;
    --brand-blue:#00AEEC;
    --brand-tint:#FFF1F5;
    --brand-tint2:#FFE0EA;
    --brand-mid:#F48FB1;

    /* ══ 中性色（对齐 resources/base/element/color.json）══ */
    --tp:#1A1A1A;   /* text_primary   16.75:1 AAA */
    --ts:#6B6B70;   /* text_secondary  5.31:1 AA  */
    --tt:#8A8A90;   /* text_tertiary   4.62:1 AA  */
    --td:#BDBDC4;   /* text_disabled */
    --divider:#E8E8EC;
    --track:#E0E0E0;
    --success:#52C41A;
    --error:#D93026;
    --press:rgba(0,0,0,.06);
    --bg:#F5F5F5;
    --surface:#FFFFFF;
    --surface2:#F2F2F4;

    /* ══ 字阶（六档，行高 1.4）══ */
    --f24:24px; --f20:20px; --f18:18px; --f16:16px; --f13:13px; --f11:11px;
    /* ══ 间距（4 的倍数）══ */
    --s4:4px; --s8:8px; --s12:12px; --s16:16px; --s24:24px; --s40:40px;
    /* ══ 圆角（三档）══ */
    --r8:8px; --r12:12px; --rpill:999px;
    /* ══ 尺度 ══ */
    --hit:44px;
    --bar-h:56px;
    --bar-bottom:54px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#1E1E22;color:#E8E8EC;
    font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    padding:32px 24px;line-height:1.4;
  }
  .doc-head{max-width:1320px;margin:0 auto 28px}
  .doc-head h1{font-size:24px;font-weight:500;margin-bottom:8px}
  .doc-head p{font-size:13px;color:#9A9AA4}
  .tag{
    display:inline-block;background:rgba(251,114,153,.16);color:#FB7299;
    font-size:11px;padding:3px 10px;border-radius:999px;margin:10px 6px 0 0;
  }
  .tag.b{background:rgba(194,24,91,.22);color:#E8589B}
  .grid{display:flex;flex-wrap:wrap;gap:24px;max-width:1320px;margin:0 auto}
  .slot{display:flex;flex-direction:column;gap:8px}
  .slot-label{font-size:12px;color:#9A9AA4;display:flex;align-items:baseline;gap:8px}
  .slot-label b{font-size:13px;color:#E8E8EC;font-weight:500}
  .slot-label i{font-style:normal;color:#6B6B70}
  .screen-wrap{width:390px;height:844px;border-radius:20px;overflow:hidden;position:relative}
  .phone{width:390px;height:844px;background:var(--bg);position:relative;overflow:hidden}
  .flex-col{display:flex;flex-direction:column}
  .flex1{flex:1;min-height:0}
  .status{
    height:47px;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 24px 6px;font-size:11px;flex:none;
  }
  .home-ind{
    position:absolute;left:50%;transform:translateX(-50%);bottom:8px;
    width:134px;height:5px;border-radius:3px;background:rgba(0,0,0,.28);z-index:9;
  }

  /* ══ 底栏：HDS 沉浸光感悬浮胶囊（不变更项）══ */
  .lye{
    position:absolute;left:16px;right:16px;bottom:var(--bar-bottom);height:var(--bar-h);
    border-radius:36px;display:flex;align-items:center;z-index:8;overflow:hidden;
    background:rgba(255,255,255,.78);
    backdrop-filter:blur(24px) saturate(1.9);-webkit-backdrop-filter:blur(24px) saturate(1.9);
    box-shadow:0 6px 24px rgba(0,0,0,.10);
  }
  .lye::before{
    content:"";position:absolute;inset:0;border-radius:36px;
    background:var(--brand);opacity:.12;pointer-events:none;
  }
  .mini{display:flex;align-items:center;gap:8px;padding:0 8px;position:relative;z-index:1;flex:none}
  .mini-collapsed{padding:0 6px}
  .mini-disc{width:40px;height:40px;border-radius:50%;object-fit:cover;display:block}
  .mini-cover{width:32px;height:32px;border-radius:50%;object-fit:cover;display:block;flex:none}
  .mini-text{min-width:0;max-width:96px}
  .mini-title{font-size:12px;font-weight:500;color:var(--tp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini-artist{font-size:10px;color:var(--ts);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini-ctrl{display:flex;align-items:center;gap:8px}
  .tabbar{display:flex;flex:1;align-items:center;justify-content:space-around;position:relative;z-index:1;height:100%}
  .tab{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .tab svg{width:22px;height:22px}
  .tab span{font-size:10px;line-height:1.4}
  .tab.on{color:var(--brand)}
  .tab.off{color:var(--ts)}
  .ic{width:22px;height:22px;display:block;stroke:currentColor;fill:none;stroke-width:1.8}

  /* 通用 */
  .title-bar{display:flex;align-items:center;padding:6px 16px 8px;gap:8px}
  .title-bar h2{font-size:var(--f20);font-weight:700;color:var(--tp)}
  .spacer{flex:1}
  .row-item{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface)}
  .pressable:active{background:var(--press)}
  .cover48{width:48px;height:48px;border-radius:var(--r8);object-fit:cover;flex:none;background:var(--divider)}
  .cover40{width:40px;height:40px;border-radius:6px;object-fit:cover;flex:none;background:var(--divider)}
  .ti-main{flex:1;min-width:0}
  .ti-title{font-size:var(--f16);color:var(--tp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ti-sub{display:flex;align-items:center;gap:8px;margin-top:var(--s4)}
  .ti-artist{font-size:var(--f13);color:var(--ts);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .ti-dur{font-size:var(--f13);color:var(--tt);flex:none}
  .hit-more{
    width:var(--hit);height:var(--hit);display:flex;align-items:center;justify-content:center;
    flex:none;color:var(--ts);border-radius:var(--r8);
  }
  .hit-more:active{background:var(--press)}
  .hit-more svg{width:20px;height:20px}
  .divider{height:1px;background:var(--divider);margin-left:16px}
  .sec-title{font-size:var(--f16);font-weight:500;color:var(--tp);padding:12px 16px 6px}
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 40px;text-align:center}
  .empty .big{font-size:var(--f16);color:var(--ts)}
  .empty .sub{font-size:var(--f13);color:var(--tt)}
  .cta-pill{
    font-size:var(--f13);font-weight:500;color:#3D0018;
    background:var(--brand);padding:8px 18px;border-radius:var(--rpill);margin-top:8px;
  }
  .seg{display:flex;gap:8px;padding:8px 12px;flex:none}
  .seg .pill{padding:6px 14px;border-radius:var(--rpill);font-size:var(--f13);background:var(--surface);color:var(--ts)}
  .seg .pill.on{background:var(--brand);color:#3D0018;font-weight:500}
  .searchbox{
    margin:8px 16px 4px;height:40px;border-radius:var(--rpill);
    background:var(--brand-tint);display:flex;align-items:center;gap:8px;padding:0 16px;
    color:var(--ts);font-size:var(--f13);
  }
  .searchbox svg{width:18px;height:18px;color:var(--brand)}
  .set-row{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface)}
  .set-row .lbl{font-size:var(--f16);color:var(--tp)}
  .set-row .desc{font-size:var(--f11);color:var(--tt);margin-top:2px}
  .switch{width:44px;height:26px;border-radius:13px;background:var(--track);position:relative;flex:none}
  .switch.on{background:var(--brand)}
  .switch::after{
    content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)
  }
  .switch.on::after{left:21px}
  .chev{width:16px;height:16px;color:var(--td);flex:none}
  .dl-row{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface)}
  .prog{height:3px;border-radius:2px;background:var(--track);margin-top:6px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--brand);border-radius:2px}
  .prog.paused i{background:var(--td)}
  .hit-icon{
    width:var(--hit);height:var(--hit);display:flex;align-items:center;justify-content:center;
    flex:none;border-radius:var(--r8);color:var(--ts)
  }
  .hit-icon:active{background:var(--press)}
  .hit-icon svg{width:18px;height:18px}
  .badge-live{font-size:11px;color:var(--brand-deep);margin-left:6px;flex:none}
  .btn-pill{
    flex:1;height:32px;border-radius:16px;background:var(--brand-tint);
    display:flex;align-items:center;justify-content:center;font-size:13px;
    color:var(--brand-deep);font-weight:500;
  }
  .btn-solid{
    flex:1;height:40px;border-radius:20px;background:var(--brand);
    display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:500;color:#3D0018;
  }

  /* ══ 播放页：沉浸背景（主色取封面）══ */
  .player-bg{
    width:100%;height:100%;position:relative;color:#fff;overflow:hidden;
    background:linear-gradient(165deg,#7A2E52 0%,#4A1B38 48%,#24101F 100%);
  }
  .player-bg::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(circle at 28% 18%, rgba(251,114,153,.42), transparent 55%),
      radial-gradient(circle at 78% 62%, rgba(168,85,247,.26), transparent 52%);
    opacity:.55;
  }
  .top-cast{height:48px;display:flex;align-items:center;justify-content:flex-end;padding:0 24px;position:relative;z-index:3;flex:none;color:#fff}
  .top-cast svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8}
  .big-cover{width:calc(100% - 6px);aspect-ratio:1;border-radius:var(--r8);object-fit:cover;display:block;box-shadow:0 8px 12px rgba(0,0,0,.25);margin:0 3px;background:rgba(255,255,255,.12)}
  .p-title{font-size:var(--f20);font-weight:700;color:#fff;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p-artist{font-size:14px;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctrl-fn{display:flex;align-items:center;justify-content:space-between;width:100%}
  .ctrl-fn svg{width:24px;height:24px;color:#fff;opacity:.86}
  .slider{height:16px;display:flex;align-items:center;margin:0 -4px}
  .slider .line{height:3px;background:rgba(255,255,255,.2);border-radius:2px;flex:1;position:relative}
  .slider .line i{position:absolute;left:0;top:0;height:100%;background:rgba(255,255,255,.86);border-radius:2px;display:block}
  .slider .knob{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;top:50%;transform:translate(-50%,-50%);box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .times{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.6);font-weight:500}
  .ctrl-main{display:flex;align-items:center;justify-content:space-between;padding:0 36px;width:100%}
  .ctrl-main .side{width:26px;height:26px;color:#fff;opacity:.86}
  .ctrl-main .play{width:44px;height:44px;color:#fff}
  .dots{display:flex;gap:6px;justify-content:center;padding:10px 0 0;flex:none}
  .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2);display:block}
  .dots i.on{background:rgba(255,255,255,.86)}
  .lyric-head{display:flex;align-items:center;gap:10px;width:100%}
  .lyric-head img{width:48px;height:48px;border-radius:var(--r8);object-fit:cover}
  .lyric-head .t{font-size:var(--f16);font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lyric-head .a{font-size:12px;color:rgba(255,255,255,.6);margin-top:2px;font-weight:500}
  .lyric-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:0 4px}
  .lyric-body .ln{font-size:var(--f16);color:rgba(255,255,255,.45);line-height:1.5;text-align:center}
  .lyric-body .ln.cur{color:#fff;font-weight:500;font-size:var(--f18)}
  .sheet{
    position:absolute;left:0;right:0;bottom:0;height:520px;background:var(--surface);
    border-radius:16px 16px 0 0;z-index:10;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 -4px 24px rgba(0,0,0,.12);
  }
  .sheet-drag{width:36px;height:4px;border-radius:2px;background:var(--td);margin:8px auto 0;flex:none}
  .sheet-head{display:flex;align-items:center;gap:8px;padding:16px 24px 12px;flex:none}
  .sheet-head h3{font-size:var(--f18);font-weight:700;color:var(--tp)}
  .mode-pill{
    display:flex;align-items:center;gap:4px;padding:4px 12px;border-radius:var(--r12);
    background:var(--brand-tint);color:var(--brand-deep);font-size:12px;font-weight:500;
  }
  .mode-pill svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
  .q-row{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 24px}
  .q-idx{width:24px;flex:none;text-align:center;font-size:var(--f13);color:var(--ts)}
  .q-idx .wf{width:16px;height:16px;margin:0 auto;color:var(--brand)}
  .spec-note{
    background:rgba(255,255,255,.06);border-radius:var(--r12);padding:12px 16px;
    font-size:12px;color:#9A9AA4;line-height:1.7;
  }
  .spec-note.on-light{background:rgba(0,0,0,.04);color:var(--ts)}
  .spec-note b{color:#E8E8EC;font-weight:500}
  .spec-note.on-light b{color:var(--tp)}
  .spec-note code{
    background:rgba(255,255,255,.08);padding:1px 5px;border-radius:4px;
    font-family:Consolas,Monaco,monospace;font-size:11px;color:#C9A9E8;
  }
  .spec-note.on-light code{background:rgba(251,114,153,.12);color:var(--brand-deep)}
  .spec-screen{
    width:390px;height:844px;background:var(--bg);position:relative;
    padding:60px 20px 0;display:flex;flex-direction:column;gap:14px;overflow:hidden;
  }
  .spec-card{background:var(--surface);border-radius:var(--r12);padding:12px 14px;flex:none}
  .spec-card h4{font-size:var(--f13);font-weight:500;color:var(--tp);margin-bottom:10px}
  .lye-static{position:relative;left:0;right:0;bottom:0;margin:0}
  .hit-ring{position:absolute;border:1px dashed rgba(251,114,153,.55);border-radius:var(--r8);pointer-events:none}
  .anno{
    position:absolute;font-size:10px;color:var(--ts);z-index:11;
    background:rgba(255,255,255,.92);padding:2px 6px;border-radius:4px;white-space:nowrap;
  }
  .anno-pink{color:var(--brand-deep);background:var(--brand-tint)}
  .swatch{display:flex;align-items:center;gap:12px;padding:8px 0}
  .swatch .chip{width:56px;height:40px;border-radius:8px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
  .swatch .meta{flex:1;min-width:0}
  .swatch .nm{font-size:13px;font-weight:500;color:var(--tp)}
  .swatch .hex{font-size:11px;color:var(--tt);font-family:Consolas,Monaco,monospace}
  .swatch .use{font-size:11px;color:var(--ts);margin-top:2px}
  .ratio{font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;flex:none}
  .ratio.pass{background:#EAF3DE;color:#3B6D11}
  .ratio.fail{background:#FCEBEB;color:#A32D2D}
  .ratio.na{background:var(--surface2);color:var(--tt)}
</style>
</head>
<body>

<div class="doc-head">
  <h1>BiliMusic · 界面 / 组件 / 原型方案</h1>
  <p>依据 <code style="color:#C9A9E8">HarmonyOS-Phone/entry/src/main/ets</code> 最新代码绘制 · 画布 390×844 · 底栏（HDS 沉浸光感悬浮胶囊）为不变更项 · 哔哩哔哩粉色基调</p>
  <div>
    <span class="tag">底栏不变更</span>
    <span class="tag">播放页重构</span>
    <span class="tag">双粉策略</span>
    <span class="tag b">三档灰 / 六档字阶</span>
    <span class="tag b">44vp 触达</span>
  </div>
</div>

<div class="grid" id="grid"></div>

<script>
/* ══════ 图标集（内联 SVG，对应 sys.symbol.*）══════ */
const I = {
  search:'<svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21" stroke-linecap="round"/></svg>',
  list:'<svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/></svg>',
  download:'<svg class="ic" viewBox="0 0 24 24"><path d="M12 3v11"/><path d="M7.5 10.5L12 15l4.5-4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 18h14"/></svg>',
  gear:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6" stroke-linecap="round"/></svg>',
  prev:'<svg class="ic" viewBox="0 0 24 24"><path d="M18 5v14L8 12l10-7z" stroke-linejoin="round"/><rect x="4" y="5" width="2.5" height="14" rx="1" fill="currentColor" stroke="none"/></svg>',
  next:'<svg class="ic" viewBox="0 0 24 24"><path d="M6 5v14l10-7L6 5z" stroke-linejoin="round"/><rect x="17.5" y="5" width="2.5" height="14" rx="1" fill="currentColor" stroke="none"/></svg>',
  play:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M10 8.5l6 3.5-6 3.5z" stroke-linejoin="round"/></svg>',
  pause:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M10 9v6M14 9v6" stroke-linecap="round" stroke-width="2"/></svg>',
  trash:'<svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6.5 7l1 12.5h9L17.5 7"/><path d="M10.5 10.5v6M13.5 10.5v6" stroke-linecap="round"/></svg>',
  xmark:'<svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>',
  waveform:'<svg class="ic" viewBox="0 0 24 24"><path d="M4 12h2M8 8v8M12 5v14M16 8v8M20 11v2" stroke-linecap="round" stroke-width="2"/></svg>',
  more:'<svg class="ic" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  cast:'<svg viewBox="0 0 24 24"><path d="M3 17.5v2a2 2 0 002 2h2"/><path d="M21 17.5v2a2 2 0 01-2 2h-2"/><rect x="12" y="3" width="9" height="9" rx="1.5"/></svg>',
  repeat:'<svg class="ic" viewBox="0 0 24 24"><path d="M4 9a5 5 0 015-5h11"/><path d="M17 1.5l3.5 3L17 8"/><path d="M20 15a5 5 0 01-5 5H4"/><path d="M7 22.5L3.5 19.5 7 16.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>'
};

/* 封面占位：粉色系渐变（贴合 B 站基调） */
function coverData(size, hue){
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="'+size+'" height="'+size+'">'+
    '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">'+
    '<stop offset="0" stop-color="hsl('+hue+',68%,68%)"/>'+
    '<stop offset="1" stop-color="hsl('+((hue+38)%360)+',62%,50%)"/></linearGradient></defs>'+

/* ══════ 底栏：HDS 沉浸光感悬浮胶囊（不变更项）═════

   默认      → 展开：封面32 + 文字 + 三键，与页签一行融合            */
function Bar(active, opts){
  const o = opts || {};
  const tabs = [['搜索',I.search,0],['歌单',I.list,1],['下载',I.download,2],['设置',I.gear,3]];
  const tabHtml = tabs.map(function(t){
    return '<div class="tab '+(active===t[2]?'on':'off')+'">'+t[1]+'<span>'+t[0]+'</span></div>';
  }).join('');
  let mini = '';
  if(!o.tabsOnly){
    mini = o.collapsed
      ? '<div class="mini mini-collapsed"><img class="mini-disc" src="'+coverData(40,330)+'" alt=""></div>'
      : '<div class="mini">'+
          '<img class="mini-cover" src="'+coverData(32,330)+'" alt="">'+
          '<div class="mini-text"><div class="mini-title">妄想感傷代償連盟</div>'+

            '<div style="width:16px;height:16px">'+I.next+'</div>'+
          '</div></div>';
  }
  return '<div class="lye">'+mini+'<div class="tabbar">'+tabHtml+'</div></div>';
}

function tabsOnly(active){
  const t=[['搜索',I.search,0],['歌单',I.list,1],['下载',I.download,2],['设置',I.gear,3]];

/* ══════ SP12 底栏规格（不变更项，三态）═════ */
function SP12(){

  return '<div class="spec-screen">'+
    StatusBar(false)+
    '<div style="padding:0 4px;flex:none"><h3 style="font-size:18px;font-weight:700;color:var(--tp);margin-bottom:4px">底栏规格（不变更）</h3>'+
      '<div style="font-size:12px;color:var(--ts)">HdsTabs 沉浸光感悬浮胶囊 · 离底 20 + safeBottom</div></div>'+

      '<div style="font-size:11px;color:var(--tt);margin-top:10px">点圆盘经 onExpandRequest → applyMiniBarStyle(EXPAND)</div></div>'+
    '<div class="spec-card"><h4>C · 展开态 EXPAND → 融合一行</h4>'+
      '<div style="height:56px"><div class="lye lye-static">'+miniExpanded+tabsOnly(0)+'</div></div>'+
      '<div style="font-size:11px;color:var(--tt);margin-top:10px">HORIZONTAL：播放栏左、页签右，同一个胶囊</div></div>'+
    '<div class="spec-note on-light"><b>四项合起来才是「沉浸光感」</b><br>'+
      'systemMaterialEffect → <code>IMMERSIVE</code>（支持时 EXQUISITE）<br>'+
      'lightColor → <code>#FB7299 α12%</code> 主题色光晕<br>'+
      'barOpacity → <code>0.9</code> 微透明<br>'+
      'barBottomMargin → <code>20 + safeBottom</code></div>'+
  '</div>';
}
