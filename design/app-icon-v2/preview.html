<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BiliMusic 图标 · 第二组十案</title>
<style>
  :root { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  body { margin: 0; background: #FFFFFF; color: #1A1A1A; }
  .band { padding: 22px 26px 10px; }
  .band.light { background: #F5F5F7; }
  .band.dark  { background: #121216; color: #F5F5F7; }
  .band h2 { font-size: 13px; font-weight: 600; letter-spacing: .4px; margin: 0 0 16px; opacity: .62; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: repeat(5, 176px); gap: 18px 22px; }
  .cell { }
  .big { width: 176px; height: 176px; border-radius: 40px; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
  .big img { width: 100%; height: 100%; display: block; }
  .sm { display: flex; gap: 12px; align-items: flex-end; margin-top: 12px; }
  .s48 { width: 48px; height: 48px; border-radius: 11px; overflow: hidden; }
  .s32 { width: 32px; height: 32px; border-radius: 7px; overflow: hidden; }
  .sm img { width: 100%; height: 100%; display: block; }
  .cap { margin-top: 9px; font-size: 12px; line-height: 17px; }
  .cap b { font-weight: 600; }
  .cap i { font-style: normal; opacity: .42; font-size: 11px; }
  .cap span { opacity: .58; font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
</style>
</head>
<body>

<div class="band light">
  <h2>浅色背景 · 176 / 48 / 32</h2>
  <div class="grid">
    <div class="cell"><div class="big"><img src="01-wave-bars.svg"></div><div class="sm"><div class="s48"><img src="01-wave-bars.svg"></div><div class="s32"><img src="01-wave-bars.svg"></div></div><div class="cap"><b>01 声波柱</b> <i>聆听</i><br><span>#2563EB</span></div></div>
    <div class="cell"><div class="big"><img src="02-play-circle.svg"></div><div class="sm"><div class="s48"><img src="02-play-circle.svg"></div><div class="s32"><img src="02-play-circle.svg"></div></div><div class="cap"><b>02 播放环</b> <i>播放</i><br><span>#C2410C</span></div></div>
    <div class="cell"><div class="big"><img src="03-speaker.svg"></div><div class="sm"><div class="s48"><img src="03-speaker.svg"></div><div class="s32"><img src="03-speaker.svg"></div></div><div class="cap"><b>03 音箱</b> <i>外放</i><br><span>#334155</span></div></div>
    <div class="cell"><div class="big"><img src="04-retro-tv.svg"></div><div class="sm"><div class="s48"><img src="04-retro-tv.svg"></div><div class="s32"><img src="04-retro-tv.svg"></div></div><div class="cap"><b>04 台式电视</b> <i>拟物 · 方</i><br><span>#B45309</span></div></div>
    <div class="cell"><div class="big"><img src="05-portable-tv.svg"></div><div class="sm"><div class="s48"><img src="05-portable-tv.svg"></div><div class="s32"><img src="05-portable-tv.svg"></div></div><div class="cap"><b>05 便携电视</b> <i>拟物 · 横</i><br><span>#0E7490</span></div></div>
    <div class="cell"><div class="big"><img src="06-vinyl.svg"></div><div class="sm"><div class="s48"><img src="06-vinyl.svg"></div><div class="s32"><img src="06-vinyl.svg"></div></div><div class="cap"><b>06 黑胶</b> <i>唱片</i><br><span>#4338CA</span></div></div>
    <div class="cell"><div class="big"><img src="07-headphones.svg"></div><div class="sm"><div class="s48"><img src="07-headphones.svg"></div><div class="s32"><img src="07-headphones.svg"></div></div><div class="cap"><b>07 耳机</b> <i>佩戴</i><br><span>#7C2D12</span></div></div>
    <div class="cell"><div class="big"><img src="08-note.svg"></div><div class="sm"><div class="s48"><img src="08-note.svg"></div><div class="s32"><img src="08-note.svg"></div></div><div class="cap"><b>08 单音符</b> <i>旋律</i><br><span>#15803D</span></div></div>
    <div class="cell"><div class="big"><img src="09-beamed-notes.svg"></div><div class="sm"><div class="s48"><img src="09-beamed-notes.svg"></div><div class="s32"><img src="09-beamed-notes.svg"></div></div><div class="cap"><b>09 双音符</b> <i>节拍</i><br><span>#7E22CE</span></div></div>
    <div class="cell"><div class="big"><img src="10-console-tv.svg"></div><div class="sm"><div class="s48"><img src="10-console-tv.svg"></div><div class="s32"><img src="10-console-tv.svg"></div></div><div class="cap"><b>10 落地电视</b> <i>拟物 · 竖</i><br><span>#0F766E</span></div></div>
  </div>
</div>

<div class="band dark">
  <h2>深色背景 · 同尺寸复核</h2>
  <div class="grid">
    <div class="cell"><div class="big"><img src="01-wave-bars.svg"></div><div class="sm"><div class="s32"><img src="01-wave-bars.svg"></div></div><div class="cap"><span>01</span></div></div>
    <div class="cell"><div class="big"><img src="02-play-circle.svg"></div><div class="sm"><div class="s32"><img src="02-play-circle.svg"></div></div><div class="cap"><span>02</span></div></div>
    <div class="cell"><div class="big"><img src="03-speaker.svg"></div><div class="sm"><div class="s32"><img src="03-speaker.svg"></div></div><div class="cap"><span>03</span></div></div>
    <div class="cell"><div class="big"><img src="04-retro-tv.svg"></div><div class="sm"><div class="s32"><img src="04-retro-tv.svg"></div></div><div class="cap"><span>04</span></div></div>
    <div class="cell"><div class="big"><img src="05-portable-tv.svg"></div><div class="sm"><div class="s32"><img src="05-portable-tv.svg"></div></div><div class="cap"><span>05</span></div></div>
    <div class="cell"><div class="big"><img src="06-vinyl.svg"></div><div class="sm"><div class="s32"><img src="06-vinyl.svg"></div></div><div class="cap"><span>06</span></div></div>
    <div class="cell"><div class="big"><img src="07-headphones.svg"></div><div class="sm"><div class="s32"><img src="07-headphones.svg"></div></div><div class="cap"><span>07</span></div></div>
    <div class="cell"><div class="big"><img src="08-note.svg"></div><div class="sm"><div class="s32"><img src="08-note.svg"></div></div><div class="cap"><span>08</span></div></div>
    <div class="cell"><div class="big"><img src="09-beamed-notes.svg"></div><div class="sm"><div class="s32"><img src="09-beamed-notes.svg"></div></div><div class="cap"><span>09</span></div></div>
    <div class="cell"><div class="big"><img src="10-console-tv.svg"></div><div class="sm"><div class="s32"><img src="10-console-tv.svg"></div></div><div class="cap"><span>10</span></div></div>
  </div>
</div>

</body>
</html>
