<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">BiliMusic app icon — Vinyl</title>
  <desc id="desc">黑胶唱片方案，正对播放栏那个常驻旋转的圆盘。深粉底、白色唱片本体、三道浅粉沟槽、粉色中心标签与白色播放三角。</desc>

  <g id="background-layer">
    <rect x="0" y="0" width="1024" height="1024" fill="#C2185B"/>
  </g>

  <g id="foreground-layer">
    <circle id="disc" cx="512" cy="512" r="310" fill="#FFFFFF"/>
    <g id="grooves" fill="none" stroke="#F7B8C9" stroke-width="18">
      <circle cx="512" cy="512" r="272"/>
      <circle cx="512" cy="512" r="228"/>
      <circle cx="512" cy="512" r="184"/>
    </g>
    <circle id="label" cx="512" cy="512" r="122" fill="#FB7299"/>
    <path
      id="play-triangle"
      d="M 574 512 L 486 462 L 486 562 Z"
      fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round"/>
  </g>
</svg>
