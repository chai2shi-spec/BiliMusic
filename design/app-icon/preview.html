<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 16px; background: #ffffff; font-family: sans-serif; }
  .row { display: flex; gap: 14px; }
  .cell { text-align: center; }
  .big { width: 190px; height: 190px; border-radius: 42px; overflow: hidden; }
  .big img { width: 100%; height: 100%; display: block; }
  .sm { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
  .s48 { width: 48px; height: 48px; border-radius: 11px; overflow: hidden; }
  .s32 { width: 32px; height: 32px; border-radius: 8px; overflow: hidden; }
  .s48 img, .s32 img { width: 100%; height: 100%; display: block; }
  .cap { margin-top: 8px; font-size: 13px; color: #333; }
  .star { color: #C2185B; font-weight: bold; }
</style>
</head>
<body>
<div class="row">
  <div class="cell">
    <div class="big"><img src="01-wave-bars.svg"></div>
    <div class="sm"><div class="s48"><img src="01-wave-bars.svg"></div><div class="s32"><img src="01-wave-bars.svg"></div></div>
    <div class="cap"><span class="star">★</span> 01 Wave Bars</div>
  </div>
  <div class="cell">
    <div class="big"><img src="02-headphones.svg"></div>
    <div class="sm"><div class="s48"><img src="02-headphones.svg"></div><div class="s32"><img src="02-headphones.svg"></div></div>
    <div class="cap">02 Headphones</div>
  </div>
  <div class="cell">
    <div class="big"><img src="03-audio-ring.svg"></div>
    <div class="sm"><div class="s48"><img src="03-audio-ring.svg"></div><div class="s32"><img src="03-audio-ring.svg"></div></div>
    <div class="cap">03 Audio Ring</div>
  </div>
  <div class="cell">
    <div class="big"><img src="04-vinyl.svg"></div>
    <div class="sm"><div class="s48"><img src="04-vinyl.svg"></div><div class="s32"><img src="04-vinyl.svg"></div></div>
    <div class="cap">04 Vinyl</div>
  </div>
</div>
</body>
</html>
